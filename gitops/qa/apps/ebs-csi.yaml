# ---------------------------------------------------------------------------
# AWS EBS CSI driver + an encrypted gp3 default StorageClass.
# ---------------------------------------------------------------------------
# Wave 1: nothing can create a PersistentVolumeClaim before the driver exists, so
# this is the first app in the sync order. Traefik's PVCs are the usual first
# casualty of getting this wrong.
#
# This file is ONE document on purpose, and getting here took three attempts worth
# recording. The StorageClass used to be a second document in this file, which put it
# in the root Application's recursive walk as well as in this Application's scope. Two
# consequences, both of which block the entire platform rather than just this app:
#
#   * the root Application applies it with ServerSideApply, and StorageClass has no
#     structural schema, so root's sync died with
#       failed to create typed patch object (/ebs-sc; storage.k8s.io/v1,
#       Kind=StorageClass): .spec: field not declared in schema
#   * a VolumeSnapshotClass was briefly added here too, using
#     snapshot.storage.k8s.io/v1 - CRDs kubeadm does not install and nothing here
#     installs - and root's manifest GENERATION then failed with
#       failed to discover server resources for group version
#       snapshot.storage.k8s.io/v1
#
# In an app-of-apps, root's sync is what creates every child Application. One bad
# document in one file takes down Traefik, the CSI driver, metrics-server, CNPG and
# the ten project namespaces with it, while each of them reports its own status as
# perfectly healthy.
#
# The StorageClass is therefore declared through the chart's own `storageClasses`
# values, which is the mechanism the chart provides and which keeps this file to a
# single Application. There is deliberately no VolumeSnapshotClass: the postgres
# backup path is a scheduled pg_dump, not a volume snapshot, because CloudNativePG's
# S3 backup wants long-lived AWS keys and this account has none by design. If volume
# snapshots are ever wanted, the snapshot.storage.k8s.io CRDs and a controller have to
# be installed first - see gitops/<env>/apps/shared-postgres/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ebs-csi-driver
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # The published Helm repository, not the git repository with a path into it.
    #
    # aws-ebs-csi-driver's git tags are `v1.x.y` (the driver) and
    # `helm-chart-aws-ebs-csi-driver-X.Y.Z` (the chart). There is no `v2.64.0` tag, so
    # pointing at the git repo fails with:
    #
    #   unable to resolve 'v2.64.0' to a commit SHA
    #
    # Chart 2.64.0 does exist, in kubernetes-sigs.github.io/aws-ebs-csi-driver, whose
    # appVersion is 1.64.0 - the pair this file already intended. Index read
    # 2026-10-04, where the newest is chart 2.66.0 = driver 1.66.0.
    #
    # Every key below was read out of that chart's own values.schema.json rather than
    # remembered. An earlier version of this file used controller.image,
    # controller.volumePermissionsFeature and a top-level daemonset block, none of which
    # that schema allows:
    #
    #   at '/controller': additional properties 'image', 'volumePermissionsFeature'
    #     not allowed
    #   at '': additional properties 'daemonset' not allowed
    #
    # The image is top-level in this chart, the DaemonSet is configured under `node`,
    # and volume modification is controller.volumeModificationFeature.
    repoURL: https://kubernetes-sigs.github.io/aws-ebs-csi-driver
    chart: aws-ebs-csi-driver
    targetRevision: 2.64.0
    helm:
      releaseName: aws-ebs-csi-driver
      values: |
        # Top-level `image`, not controller.image. The chart runs the same image for
        # the controller Deployment and the node DaemonSet.
        #
        # arm64 is published, which is what the Graviton decision in Infrastructure.MD
        # depends on, so the tag is pinned here rather than inherited from the chart
        # default - which is "v<AppVersion>", and would follow a chart bump silently.
        image:
          tag: v1.64.0

        controller:
          # One replica: the chart default, and enough here. This cluster exists to
          # prove the storage path works, not to survive a controller restart without a
          # gap in provisioning.
          replicaCount: 1
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              # A memory ceiling and no CPU limit. This is a control-plane component
              # that should never be the reason a node runs out of CPU, but it does
              # need a memory bound so a leak is a restart rather than a node eviction
              # that takes everything else with it.
              memory: 256Mi
          serviceAccount:
            annotations:
              # IRSA onto the node role created in 20-security, which already carries the
              # EBS CSI permissions and is scoped to this cluster's own KMS keys and
              # buckets. No new IAM role is created here: a second role for the same
              # permissions is one more thing to keep in sync with 20-security and
              # nothing to show for it.
              #
              # Hardcoded because the OIDC provider is per-account and the role is
              # per-environment, and gitops/ is plain YAML with no templating. If the
              # role is ever renamed, this annotation has to change with it - and the
              # failure is visible: the driver logs a credentials error and no PVC
              # binds.
              eks.amazonaws.com/role-arn: arn:aws:iam::580857072251:role/dpx-qa-node-role

        # The node DaemonSet is configured under `node`, not a top-level `daemonset`.
        # enableWindows has to be false, or the chart renders a Windows DaemonSet that
        # can never schedule on a Linux-only cluster.
        node:
          enableWindows: false
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          tolerations:
            # The chart's default tolerates NoExecute for 300s, which does not cover a
            # control-plane taint with no execute. `operator: Exists` with no key
            # tolerates everything, which is what a node-level DaemonSet wants: it has
            # to run on every node whatever is tainted there.
            - operator: Exists

        # No sidecar overrides. The chart's defaults pin current sidecar versions, and
        # overriding them here is how a driver ends up running a csi-provisioner that
        # predates the driver it talks to.

        # ---------------------------------------------------------------- storage
        # gp3 rather than the chart's gp2 default: this is a cost-lean environment and
        # gp2 costs more per GB and is slower.
        #
        # encrypted: true, so every volume the driver provisions is encrypted with the
        # account's EBS KMS key - the same key 30-cluster uses for node root volumes.
        # The key is not named here because the driver resolves encrypted volumes
        # through the account default, and this account has exactly one EBS CMK
        # (verified with `aws kms list-aliases`).
        #
        # Delete rather than Retain: these environments are torn down often, and Retain
        # leaves a volume behind on every teardown with nothing left to manage it.
        #
        # The chart renders each entry here verbatim into a StorageClass, setting the
        # provisioner itself, and defaults volumeBindingMode to WaitForFirstConsumer.
        storageClasses:
          - name: ebs-sc
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
            type: gp3
            reclaimPolicy: Delete
            volumeBindingMode: WaitForFirstConsumer
            allowVolumeExpansion: true
            parameters:
              type: gp3
              encrypted: "true"
              fsType: ext4

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Client-side apply for this Application, not server-side.
      #
      # The StorageClass above is the reason, and it is not a style choice:
      # StorageClass is one of the handful of built-in types with no structural
      # schema, so server-side apply cannot build a typed patch for it and the sync
      # fails with
      #
      #   failed to create typed patch object (/ebs-sc; storage.k8s.io/v1,
      #   Kind=StorageClass): .spec: field not declared in schema
      #
      # which fails the whole Application, driver DaemonSet included. A per-object
      # `argocd.argoproj.io/sync-options: ClientSideApply=true` annotation is the
      # tidier fix and does not work - Argo CD still generates the typed patch for the
      # Application as a whole. So this Application opts out wholesale.
      #
      # What is given up: apply idempotency and field ownership between Applications.
      # Nothing else in this cluster writes either the driver or this StorageClass, so
      # there is no second writer to conflict with.
      - ClientSideApply=true
      - RespectIgnoreDifferences=true
