# ---------------------------------------------------------------------------
# The SSM-backed ClusterSecretStore, as its own Application.
# ---------------------------------------------------------------------------
# This exists as a separate Application for a specific reason, and moving it back
# into a file the root Application walks will break the whole cluster again.
#
# A ClusterSecretStore is a CRD installed by the External Secrets Operator. The root
# Application is a plain directory source, and to build manifests for it Argo CD
# first has to resolve every GVK it finds against the live API server. With no CRD
# registered for external-secrets.io/v1beta1 yet, generation fails:
#
#   failed to discover server resources for group version external-secrets.io/v1beta1:
#   the server could not find the requested resource (retried 5 times)
#
# That is a manifest-GENERATION failure, not an apply-ordering one, which is why a
# sync-wave annotation does not help: nothing is applied at all, wave 0 included.
# Since the root Application's sync is what creates Traefik, the CSI driver,
# metrics-server, CloudNativePG and the ApplicationSet for the ten project
# namespaces, one CR with no CRD takes all of it down.
#
# Wrapping it in an Application fixes it because the root Application then only has
# to resolve argoproj.io/v1alpha1, which exists. This Application's own generation
# fails until the operator installs the CRD, and then Argo CD's retry loop converges
# it - which is the mechanism that is meant to be used here.
#
# The same shape as the shared-postgres Application, and for the same reason: the
# directory is excluded from the root Application's recursive walk. See the exclude
# glob in infra/modules/platform-bootstrap/templates/bootstrap-platform.sh.tftpl.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-paramstore-store
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/AdepuShashank/aws_infra
    targetRevision: main
    path: gitops/qa/apps/secret-store

  # Cluster-scoped, so the destination namespace is only where Argo CD's own
  # bookkeeping lives. The object is applied to the cluster, not into argocd.
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # CreateNamespace=false: this is a cluster-scoped CR, and asking Argo CD to
      # create the argocd namespace would be both unnecessary and alarming in a plan.
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
