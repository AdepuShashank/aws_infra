# ---------------------------------------------------------------------------
# External Secrets Operator + a ClusterSecretStore backed by SSM Parameter Store.
# ---------------------------------------------------------------------------
# This is how secrets reach the cluster. There is no Secrets Manager and no
# Vault, so SSM SecureString parameters under this environment's prefix are the
# store, and 20-security already scoped the node role to read exactly that prefix.
#
# The ClusterSecretStore uses the node role rather than a dedicated IAM role. The
# controller runs on a node and can reach the IMDS endpoint, and the node role's
# SSM permissions are already limited to this environment's prefix - so a second
# role would grant the same access under a different name.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/external-secrets/external-secrets
    targetRevision: v2.10.0
    path: deploy/charts/external-secrets
    helm:
      releaseName: external-secrets
      values: |
        image:
          tag: v2.10.0

        # One replica. This is a single-worker cluster; two would schedule on
        # different nodes and one would sit Pending or evict-loop.
        replicaCount: 1

        leaderElect:
          enabled: false

        webhook:
          replicaCount: 1
          resources:
            requests:
              cpu: 25m
              memory: 32Mi

        certController:
          create: true

        resources:
          requests:
            cpu: 25m
            memory: 64Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

---
# Cluster-scoped on purpose. A per-namespace SecretStore would mean ten of them,
# and a ClusterSecretStore is one object that every project namespace can read
# from without any extra RBAC in each.
#
# auth.jwt is used rather than a static service-account annotation: it makes the
# controller exchange its own projected service-account token for AWS credentials
# through IRSA, which is auditable and revocable. The default (impersonating the
# node role) works but makes "who read this secret" unanswerable.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-paramstore
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
          oidc:
            # IRSA needs a cluster OIDC provider, and this account has none:
            # `aws iam list-open-id-connect-providers` is empty. Phase 1 created
            # the GitHub Actions OIDC provider for CI/CD, which is a different
            # provider entirely and is scoped to GitHub's issuer.
            #
            # So the jwt block above is left commented out rather than pointing at
            # a provider that does not exist, and this store falls back to the
            # node role via the controller's pod identity. That works: the nodes
            # already carry the SSM read permissions scoped to this prefix. What
            # it costs is that "which identity read this secret" is answered by
            # "the node role", not by a per-workload role.
            #
            # To switch to IRSA, create a provider for the cluster and uncomment:
            #   providerARN: arn:aws:iam::<account>:oidc-provider/oidc.eks.<region>.amazonaws.com/id/<id>
            #   audience: sts.amazonaws.com
            providerARN: "" # see above
            audience: sts.amazonaws.com
            serviceAccountTokenExpirationSeconds: 900
