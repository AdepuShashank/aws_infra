# ---------------------------------------------------------------------------
# CloudNativePG operator
# ---------------------------------------------------------------------------
# The operator that runs the shared Postgres. The Cluster itself is NOT created here
# and NOT created by the ApplicationSet - it is in
# gitops/prod/apps/shared-postgres/, owned by the shared-postgres Application. The
# ApplicationSet in apps/ creates per-project namespaces and nothing else.
#
# Wave 5, after the platform is up: nothing depends on the operator existing, but
# the shared-postgres Cluster does depend on the operator and on the EBS CSI driver
# (wave 1) being present.
#
# Chart version: 0.29.1, which ships operator 1.30.1. Verified against
# https://cloudnative-pg.github.io/charts/index.yaml rather than assumed - this file
# previously pinned 0.28.0, whose operator (1.29.x) is out of support. Bumping the
# operator while a Cluster exists is an in-place rolling upgrade of a single replica
# and takes the database with it for a few seconds, so do it when nobody is using it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.1
    helm:
      releaseName: cloudnative-pg
      values: |
        crds:
          # The operator watches for CRD updates itself. Leaving this on means
          # every sync rewrites three large CRDs for no change.
          create: false

        operator:
          # One replica: a single-worker cluster, and two would not both fit
          # comfortably next to everything else.
          replicaCount: 1
          resources:
            requests:
              cpu: 25m
              memory: 64Mi

        # The webhook is what validates Cluster objects on write. Turning it off
        # means a bad spec is accepted and fails later, inside PostgreSQL.
        webhook:
          enabled: true
          replicaCount: 1
          resources:
            requests:
              cpu: 25m
              memory: 32Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
