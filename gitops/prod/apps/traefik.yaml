# ---------------------------------------------------------------------------
# Traefik - the only ingress path.
# ---------------------------------------------------------------------------
# NodePort 30080, because that is what the ALB target group targets (see
# infra/modules/edge). Not LoadBalancer and not ClusterIP: a LoadBalancer service
# would provision a second, more expensive load balancer and quietly become the
# real entry point, and the ALB would sit in front of nothing.
#
# The health check is the part that is easy to get wrong. The ALB requests
# /ping on the traffic port, so Traefik has to answer /ping on the web entrypoint.
# Traefik 3 does that with `entryPoints.traefik.ping.entryPoint: traefik`, which
# serves the ping endpoint on the web entrypoint instead of a separate one.
# Two NodePorts cannot share a number, so giving ping its own entrypoint would
# force the ALB to target a port it cannot also use for real traffic.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # Traefik's own Helm repository, NOT argoproj.github.io/argo-helm.
    #
    # The argo-helm index was read on 2026-10-04 and its newest entry for a chart
    # named traefik is 0.16.10, from 2021. Chart 41.x exists, but only in
    # traefik.github.io - so pointing at argo-helm fails with:
    #
    #   chart "traefik" version "41.4.0" not found in
    #   https://argoproj.github.io/argo-helm repository
    #
    # which reads like a bad version pin rather than a bad repository, and argo-helm
    # is a plausible-looking default to reach for.
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.6.1
    helm:
      releaseName: traefik
      values: |
        # Namespace is created by the Application's destination + CreateNamespace
        # rather than by the chart, so Argo CD owns it and can prune it.
        fullnameOverride: traefik

        image:
          # Matches chart 41.6.1's appVersion in the index on 2026-10-04.
          #
          # The previous pair here was chart 41.4.0 with image v3.6.2, and 41.4.0
          # ships v3.7.12 - so the override was pinning Traefik three minor versions
          # behind the chart whose values it was being handed. Pinning the pair
          # together is the point; a pin that disagrees with the chart is worse than
          # no pin, because it looks deliberate.
          tag: v3.7.13

        # No entryPoints block. In chart 41.x an entrypoint is generated from each
        # entry in `ports`, so the previous top-level entryPoints map was rejected by
        # the schema. The two ports below are the two that matter:
        #
        #   web     the traffic port, and the one the ALB targets. nodePort must equal
        #           traefik_http_nodeport in 40-edge and traefik_nodeports in
        #           20-security, or the ALB health check has nothing to talk to.
        #   traefik the ping port, expose.default false so it gets no Service of its
        #           own. The chart's default already serves /ping here, which is what
        #           lets one NodePort serve both traffic and health checks - a second
        #           NodePort would have to be a number the ALB is not using.
        ports:
          web:
            port: 8080
            expose:
              default: true
            nodePort: 30080
          traefik:
            port: 8080
            expose:
              default: false
            nodePort: null

        service:
          type: NodePort
          nodePort:
            http: 30080
          # The chart creates a ClusterIP service alongside the NodePort service.
          # One is enough: the ALB and the nodes both reach the NodePort.
          annotations: {}

        # No dashboard, no metrics endpoint, no ingressClass controller watching.
        # The dashboard would be an admin UI on a NodePort for no benefit in a
        # throwaway environment, and the spec does not ask for it.
        #
        # In chart 41.x the dashboard is api.dashboard, not a top-level `dashboard` -
        # the previous version of this file set `dashboard.enabled`, which the schema
        # rejects with "at '': additional properties 'entryPoints', 'dashboard' not
        # allowed".
        api:
          dashboard: false

        metrics:
          prometheus:
            enabled: false

        providers:
          # kubernetesCRD, capital RD. `kubernetesCrd` was rejected by the schema,
          # and a silently-ignored provider here would mean no IngressRoutes and no
          # error - just a Traefik that is Running and routes nothing.
          kubernetesCRD:
            enabled: true
          kubernetesIngress:
            enabled: false
          kubernetesGateway:
            enabled: false

        # Lets Traefik watch every namespace, which is where the project IngressRoutes
        # live. `namespaced: true` in chart 41.x - the old `rbac.namespaces` key is
        # rejected. Without it Traefik's RBAC does not let it read other namespaces,
        # and it goes Running while silently routing nothing.
        rbac:
          namespaced: true

        # Controllers must tolerate the control plane: with taint-based eviction the
        # control-plane node is a real place workloads can land, and Traefik refusing
        # to schedule there would leave the cluster ingressless whenever the single
        # worker is busy.
        tolerations:
          - operator: Exists
        nodeSelector:
          kubernetes.io/os: linux

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            # No CPU limit, same reasoning as the CSI controller: this is a latency-
            # sensitive data path and a CPU cap turns a burst into dropped requests.
            memory: 256Mi

        # No serviceAccount block. In chart 41.x the only key is `name`, and the
        # chart always creates the ServiceAccount, ClusterRole and ClusterRoleBinding -
        # there is no `create: false` to set, so the previous `serviceAccount.create`
        # was rejected by the schema rather than doing anything.
        #
        # The chart's RBAC objects do need to survive a prune of everything else;
        # without RespectIgnoreDifferences below, a bad sync can delete the ClusterRole
        # that lets Traefik watch namespaces, and Traefik then goes on Running while
        # routing nothing.
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # The chart's RBAC objects must survive a prune of everything else; without
      # this, a bad sync can delete the ClusterRole that lets Traefik watch
      # namespaces, and Traefik then silently stops routing while still Running.
      - RespectIgnoreDifferences=true
