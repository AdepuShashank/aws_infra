# ---------------------------------------------------------------------------
# metrics-server
# ---------------------------------------------------------------------------
# Needed before kubectl top and before any HPA works. Cheap enough to always be on:
# it is one Deployment and a handful of DaemonSet pods.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # The published Helm repository, not the git repository with a path into it.
    #
    # metrics-server's git tags are the OPERATOR's tags (v0.7.x, v0.8.x), and the Helm
    # chart's versions are an independent 3.x series. So `targetRevision: v3.14.0`
    # against github.com/kubernetes-sigs/metrics-server is a ref that has never
    # existed, and Argo CD says so:
    #
    #   unable to resolve 'v3.14.0' to a commit SHA
    #
    # which is a clearer error than it deserves. Chart 3.14.0 does exist, in
    # kubernetes-sigs.github.io/metrics-server, whose appVersion 0.9.0 is the operator
    # release the chart wraps. Reading the index on 2026-10-04: chart 3.14.0 = app
    # v0.9.0, which is the pair that was already intended here.
    repoURL: https://kubernetes-sigs.github.io/metrics-server
    chart: metrics-server
    targetRevision: 3.14.0
    helm:
      releaseName: metrics-server
      values: |
        image:
          registry: registry.k8s.io
          repository: metrics-server
          tag: v0.9.0

        args:
          # Required, not a default worth relying on. kubelet serves metrics over
          # a self-signed certificate; without these two flags metrics-server
          # refuses to scrape it and kubectl top prints "Metrics API not available"
          # while every other component looks healthy.
          - --kubelet-insecure-tls
          - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname

        resources:
          requests:
            cpu: 25m
            memory: 64Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
