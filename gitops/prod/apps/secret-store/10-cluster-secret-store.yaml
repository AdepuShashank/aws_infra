# ---------------------------------------------------------------------------
# ClusterSecretStore backed by SSM Parameter Store.
# ---------------------------------------------------------------------------
# Split out of external-secrets.yaml, and the sync wave is the whole reason.
#
# external-secrets.yaml declares the External Secrets Operator Application. This file
# declares a ClusterSecretStore - which is a CRD *installed by that operator*. When both
# documents sat in one file, the root Application applied them in the same sync wave,
# so the ClusterSecretStore was submitted before the operator had installed its CRD,
# and the API server answered:
#
#   failed to discover server resources for group version external-secrets.io/v1beta1:
#   the server could not find the requested resource (retried 5 times)
#
# That error fails the ROOT sync, which means none of the sibling Applications get
# created either - one store with a missing CRD takes down Traefik, the CSI driver,
# metrics-server and all ten project namespaces with it. That is the shape of the
# failure worth remembering: in an app-of-apps, one bad manifest blocks everything,
# so anything whose CRD is installed by a sibling Application belongs in a later wave.
#
# Wave 1 does not guarantee the CRD exists either - the operator still has to schedule
# and start. What makes this converge is that wave 0 succeeds, the operator's CRDs land,
# and the root Application's automated sync retries wave 1 with backoff until it
# succeeds. The alternative - putting this in its own Application - would need its own
# directory and its own entry in the root app's exclude glob, for the same outcome.
#
# Cluster-scoped on purpose. A per-namespace SecretStore would mean ten of them, and a
# ClusterSecretStore is one object that every project namespace can read from without any
# extra RBAC in each.
#
# auth.jwt is configured below rather than a static service-account annotation: it makes
# the controller exchange its own projected service-account token for AWS credentials
# through IRSA, which is auditable and revocable. It is currently NOT enabled, because
# this account has no cluster OIDC provider - see the note on providerARN.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-paramstore
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
          oidc:
            # IRSA needs a cluster OIDC provider, and this account has none:
            # `aws iam list-open-id-connect-providers` is empty. Phase 1 created the
            # GitHub Actions OIDC provider for CI/CD, which is a different provider
            # entirely and is scoped to GitHub's issuer.
            #
            # So the jwt block above is left unconfigured rather than pointing at a
            # provider that does not exist, and this store falls back to the node role
            # via the controller's pod identity. That works: the nodes already carry the
            # SSM read permissions scoped to this prefix. What it costs is that "which
            # identity read this secret" is answered by "the node role", not by a
            # per-workload role.
            #
            # To switch to IRSA, create a provider for the cluster and set:
            #   providerARN: arn:aws:iam::<account>:oidc-provider/oidc.eks.<region>.amazonaws.com/id/<id>
            #   audience: sts.amazonaws.com
            providerARN: "" # see above
            audience: sts.amazonaws.com
            serviceAccountTokenExpirationSeconds: 900
