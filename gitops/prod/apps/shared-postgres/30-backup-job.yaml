# ---------------------------------------------------------------------------
# Nightly logical backup of the shared database.
# ---------------------------------------------------------------------------
# CloudNativePG cannot do this itself here: its S3 backup plugin wants long-lived AWS
# keys in a Secret, and this account has none. What it can do is run a pg_dump, and
# a pod can reach S3 over the gateway endpoint using the node role's instance
# credentials - which are already scoped to exactly the two backup buckets and to
# nothing else in the account.
#
# Two containers and an emptyDir, in this order:
#
#   initContainer  postgres:17-alpine runs pg_dump into the shared volume. It exits,
#                  which is the synchronisation point - the main container cannot
#                  start until the dump is complete.
#   container      amazon/aws-cli uploads the finished file.
#
# The alternative - one container doing both - needs the AWS CLI inside the postgres
# image, and the official postgres image is alpine with no package manager configured
# for it. Shelling out to a second image and a shared volume is cheaper than a custom
# image that has to be rebuilt whenever postgres does.
#
# `pg_dump -Fc` rather than a plain SQL dump: custom format is compressed, and
# `pg_restore` can restore a single table out of it, which matters more here than
# human readability does.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shared-postgres-backup
  namespace: data
  labels:
    app.kubernetes.io/name: shared-postgres-backup
    app.kubernetes.io/part-of: dpx
    dpx.io/env: prod
  annotations:
    # Wave 3: after the Cluster (wave 1) and the policies (wave 1). Not earlier -
    # a Job that starts before the database accepts connections fails, and
    # startingDeadlineSeconds below turns that into a silent day with no backup.
    argocd.argoproj.io/sync-wave: "3"
spec:
  # 02:17 rather than 02:00. The odd minutes are deliberate across this whole
  # repository: several DLM, EventBridge and SSM schedules share the account, and
  # landing in the same minute as all of them means competing for the same
  # throttling window at the top of the hour.
  schedule: "17 2 * * *"

  timeZone: "Asia/Kolkata"

  concurrencyPolicy: Forbid

  # Two hours to start. Generous for a 1Gi database, and the point of it is that a
  # dump that fails once is retried rather than skipped until tomorrow.
  startingDeadlineSeconds: 7200

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 2

      template:
        metadata:
          labels:
            app.kubernetes.io/name: shared-postgres-backup
            app.kubernetes.io/part-of: dpx
          annotations:
            argocd.argoproj.io/sync-wave: "3"

        spec:
          restartPolicy: OnFailure

          # The bucket. Written out here rather than templated because gitops/ is
          # plain YAML with no substitution, and 20-security asserts this exact name
          # against the node role's S3 grant - a typo here fails as AccessDenied on
          # the upload, not at sync time.
          #
          # This is the bucket infra/modules/data-backups creates, in 60-ops. It
          # exists before this manifest ever syncs, which is the ordering that
          # matters: the 60-ops layer has to be applied before Argo CD can sync
          # anything that writes to it.
          env:
            - name: BACKUP_BUCKET
              value: dpx-prod-postgres-backups
            - name: AWS_REGION
              value: ap-south-1
            - name: STAMP
              valueFrom:
                # The date is generated by the pod's own clock and written into the
                # object key. Relying on the pod clock rather than a downward API
                # timestamp is deliberate: the backup's value is when the dump was
                # taken, and if the node's clock is wrong that is worth seeing in the
                # object key rather than hiding.
                fieldRef:
                  fieldPath: metadata.creationTimestamp

          # The dump itself. Runs to completion as an initContainer, which is what
          # makes the upload below a no-op until there is a complete file to upload.
          initContainers:
            - name: dump
              image: postgres:17.6-alpine
              imagePullPolicy: IfNotPresent

              env:
                - name: PGHOST
                  # -rw, not -r: a read-only service is what a backup should use, and
                  # the extra replica hop it takes is free on one instance.
                  value: shared-postgres-rw.data.svc.cluster.local
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: app
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: shared-postgres-app
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: shared-postgres-app
                      key: password

              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # STAMP is metadata.creationTimestamp, RFC3339. It is turned into a
                  # filename-safe form by substitution rather than by a brace
                  # expansion: the same expression written ${STAMP//:/-} is fine in
                  # plain YAML but is a Terraform syntax error in a .tftpl, and the
                  # two spellings being different in this repository is exactly how
                  # the next person ends up copying the wrong one somewhere.
                  STAMP=$(echo "$STAMP" | tr ':' '-' | tr 'T' '_' | cut -d'Z' -f1)
                  OUT="/out/shared-postgres-$STAMP.dump"
                  echo "dumping to $OUT"
                  # --clean --if-exists would rewrite a file this Job already wrote,
                  # which is what makes a retry overwrite rather than fail on a file
                  # that already exists. Harmless either way: the name carries a
                  # timestamp.
                  pg_dump --format=custom --compress=6 --clean --if-exists --file="$OUT"
                  ls -l "$OUT"
                  test -s "$OUT" || { echo "dump is empty, refusing to upload" >&2; exit 1; }

              volumeMounts:
                - name: dump
                  mountPath: /out

              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 256Mi

# The upload. amazon/aws-cli ships linux/arm64 builds, which is what the
          # Graviton decision in Infrastructure.MD means for every image in this
          # repository. Pinned to a <major.minor.patch> tag because those are
          # immutable - `latest` is explicitly documented as having no backwards
          # compatibility guarantees, which for an image whose whole job is to call
          # one S3 API is a risk with no upside. 2.37.9 read from Docker Hub on
          # 2026-10-04.
          containers:
            - name: upload
              image: amazon/aws-cli:2.37.9
              imagePullPolicy: IfNotPresent

              # No AWS_ACCESS_KEY_ID and no AWS_REGION here. Credentials come from
              # the node role through IMDSv2, which the 20-security baseline requires
              # and which scopes this pod to the two backup buckets and to nothing
              # else in the account. AWS_REGION is inherited from the pod spec above;
              # re-declaring it here would shadow that, and an empty value would make
              # the CLI fall back to IMDS on every call.
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  STAMP=$(echo "$STAMP" | tr ':' '-' | tr 'T' '_' | cut -d'Z' -f1)
                  FILE="/out/shared-postgres-$STAMP.dump"
                  test -s "$FILE" || { echo "no dump to upload" >&2; exit 1; }
                  # --sse aws:kms matches the bucket's default encryption and the
                  # node role's kms:GenerateDataKey grant on the EBS key. Without
                  # the flag the PutObject is denied by the bucket policy, which is
                  # the correct outcome - it means the upload cannot silently
                  # produce an unencrypted object.
                  aws s3 cp "$FILE" "s3://$BACKUP_BUCKET/shared-postgres-$STAMP.dump" \
                    --region "$AWS_REGION" \
                    --sse aws:kms
                  echo "uploaded shared-postgres-$STAMP.dump"

              volumeMounts:
                - name: dump
                  mountPath: /out
                  readOnly: true

              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 128Mi

          volumes:
            - name: dump
              # emptyDir, not a PVC. The file lives for the length of one Job and
              # then has to go: a PVC would put an encrypted copy of every project's
              # data on a volume whose lifecycle nobody would remember, which is the
              # exact thing the backup exists to avoid.
              emptyDir: {}
              sizeLimit: 256Mi

          # No tolerations and no nodeSelector: this belongs on a worker like any
          # other pod, and a scheduling rule that pins it to the control plane would
          # put the only copy of the data on the node whose replacement is the
          # thing Phase 4's fixed-ENI work exists to survive.
