{{- /*
  Namespace-scoped admin, granted to named groups.

  A Role, not a ClusterRole: a Role cannot be bound in another namespace, so this
  grant cannot be escalated by an operator who also holds it elsewhere. The
  RoleBinding names groups only - no ServiceAccount - because a ServiceAccount
  binding here would be a cluster-wide privilege for anyone who could create one
  in this namespace, and creating a ServiceAccount in a namespace is usually
  permitted.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: project-deployer
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: dpx
    dpx.io/project: {{ .Release.Namespace | quote }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: project-admin
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: dpx
    dpx.io/project: {{ .Release.Namespace | quote }}
rules:
  # Everything inside the namespace, and nothing outside it. There is no wildcard
  # rule and no cluster-scoped rule: a project that needs a cluster resource is a
  # platform change, not a per-project grant.
  #
  # One rule, deliberately. An earlier version of this chart carried a second rule
  # holding `nonResourceURLs: []` and `verbs: []`, on the reasoning that a rule with
  # nothing in it should be a no-op. It is not a no-op, it is invalid, and RBAC
  # validation rejects the whole Role:
  #
  #   Role.rbac.authorization.k8s.io "project-admin" is invalid:
  #   [rules[1].verbs: Required value: verbs must contain at least one value,
  #    rules[1].apiGroups: Required value: resource rules must supply at least one
  #    api group, rules[1].resources: Required value: resource rules must supply at
  #    least one resource]
  #
  # Note the wording: "resource rules". A rule naming only nonResourceURLs is
  # allowed, but one naming neither is not - and the empty list is not "neither" to
  # the validator, it is "a resource rule with nothing in it".
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: project-admin
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: dpx
    dpx.io/project: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: project-admin
subjects:
  {{- range .Values.rbac.groups }}
  # A group that does not exist yet is not an error. RBAC accepts the binding and
  # it starts taking effect when the group appears, which is what makes "create
  # the namespace first, invite people second" work.
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ . | quote }}
  {{- end }}
